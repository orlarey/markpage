<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>markpage — éditeur de style unifié (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&family=Lora:wght@400;500;600;700&family=EB+Garamond:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@400;600;700&family=Poppins:wght@400;500;600;700&family=PT+Serif:wght@400;700&family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=Roboto+Mono:wght@400;500&family=Source+Code+Pro:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* ET Book (MIT) — CDN faces for the editor PREVIEW only; markpage bundles them. */
  @font-face { font-family:'ET Book'; font-weight:400; font-style:normal; font-display:swap;
    src:url('https://edwardtufte.github.io/et-book/et-book/et-book-roman-line-figures/et-book-roman-line-figures.woff') format('woff'); }
  @font-face { font-family:'ET Book'; font-weight:400; font-style:italic; font-display:swap;
    src:url('https://edwardtufte.github.io/et-book/et-book/et-book-display-italic-old-style-figures/et-book-display-italic-old-style-figures.woff') format('woff'); }
  @font-face { font-family:'ET Book'; font-weight:700; font-style:normal; font-display:swap;
    src:url('https://edwardtufte.github.io/et-book/et-book/et-book-bold-line-figures/et-book-bold-line-figures.woff') format('woff'); }
  :root { --ink:#1a1f2b; --sub:#5c6473; --line:#d0d5df; --bg:#eef0f4; --accent:#3b6fb0; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink);
         background:var(--bg); display:flex; flex-direction:column; height:100vh; }
  /* header + facet tabs */
  header { flex:none; display:flex; align-items:center; gap:1rem; padding:.6rem 1.1rem; background:#fff; border-bottom:1px solid var(--line); }
  header h1 { font-size:.95rem; margin:0; }
  .tabs { display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; }
  .tabs button { font:inherit; font-size:.82rem; font-weight:600; border:0; background:#fff; color:var(--sub);
    padding:.4rem 1.1rem; cursor:pointer; border-right:1px solid var(--line); }
  .tabs button:last-child { border-right:0; }
  .tabs button.on { background:var(--accent); color:#fff; }
  /* shell body */
  .shell { flex:1; display:flex; min-height:0; }
  #editside { flex:1; min-width:0; display:flex; flex-direction:column; }
  #facetbar { flex:none; display:flex; align-items:center; padding:.55rem .8rem; background:#eef0f4; border-bottom:1px solid var(--line); }
  #editrow { flex:1; display:flex; min-height:0; }
  #panel { width:300px; flex:none; background:#fff; border-right:1px solid var(--line); padding:1rem 1.1rem 2rem; overflow-y:auto; }
  #workbench { flex:1; min-width:0; overflow:auto; padding:1.3rem 1.5rem; background:#fff; }
  #pvr { width:6px; flex:none; background:#d7dae0; cursor:col-resize; }
  #pvr:hover, #pvr.drag { background:var(--accent); }
  #preview { width:440px; flex:none; display:flex; flex-direction:column; background:#e9eaee; min-width:0; }
  .pbar { flex:none; display:flex; align-items:center; justify-content:space-between; gap:.6rem; padding:.55rem .8rem; border-bottom:1px solid #d7dae0; background:#eef0f4; }
  .plabel { font-size:.72rem; color:var(--sub); }
  .vtabs { display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; background:#fff; }
  .vtabs button { font:inherit; font-size:.7rem; border:0; background:#fff; color:var(--sub); padding:.26rem .55rem; cursor:pointer; border-right:1px solid var(--line); }
  .vtabs button:last-child { border-right:0; }
  .vtabs button.on { background:var(--accent); color:#fff; }
  .parea { flex:1; overflow:auto; display:flex; align-items:center; justify-content:center; gap:8px; padding:1.2rem; }
  .apage { box-shadow:0 3px 16px rgba(0,0,0,.20); overflow:hidden; flex:none; }
  #tip { position:fixed; display:none; z-index:20; pointer-events:none; background:#1a1f2b; color:#fff; font-size:.72rem; padding:2px 7px; border-radius:5px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  #instrument svg { user-select:none; touch-action:none; }
  #instrument svg .hit { cursor:grab; }
  #instrument svg .block { cursor:move; }
  h2 { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--sub); margin:1.2rem 0 .5rem; }
  h2:first-child { margin-top:0; }
  .block h3 { font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--sub); margin:0 0 .6rem; }
  .sub { font-size:.78rem; color:var(--sub); margin:0 0 1rem; line-height:1.4; }
  .placeholder { font-size:.8rem; color:#868d9b; line-height:1.5; border:1px dashed var(--line); border-radius:8px; padding:.9rem; }
  /* colour controls */
  .huewrap { display:flex; align-items:center; gap:.6rem; }
  .hue { -webkit-appearance:none; appearance:none; flex:1; height:12px; border-radius:6px;
    background:linear-gradient(to right,hsl(0,70%,50%),hsl(60,70%,50%),hsl(120,70%,50%),hsl(180,70%,50%),hsl(240,70%,50%),hsl(300,70%,50%),hsl(360,70%,50%)); }
  .hue::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:#fff; border:3px solid #1a1f2b; cursor:grab; }
  .val { font-variant-numeric:tabular-nums; min-width:3em; text-align:right; font-size:.82rem; }
  select { font:inherit; font-size:.8rem; padding:.3rem; border:1px solid var(--line); border-radius:6px; background:#fff; width:100%; }
  .field { display:flex; align-items:center; justify-content:space-between; gap:.5rem; font-size:.8rem; color:var(--sub); margin:.5rem 0; }
  .field input[type=range] { flex:1; accent-color:var(--accent); }
  .fam { display:flex; align-items:center; gap:.5rem; font-size:.78rem; color:var(--sub); margin:.35rem 0; }
  .fam .sw { width:22px; height:22px; border-radius:5px; border:1px solid rgba(0,0,0,.15); }
  .fam b { color:var(--ink); }
  .actions button { width:100%; font:inherit; font-size:.8rem; padding:.5rem; border-radius:8px; border:1px solid var(--accent); background:#fff; color:var(--accent); cursor:pointer; margin-top:1rem; }
  /* carte instrument */
  .carte { display:flex; gap:12px; align-items:flex-start; }
  .neutral { display:flex; flex-direction:column; gap:5px; }
  .grids { display:flex; flex-direction:column; gap:14px; }
  .glabel { font-size:.66rem; color:var(--sub); margin-bottom:5px; display:flex; align-items:center; gap:6px; }
  .glabel .dot { width:11px; height:11px; border-radius:50%; border:1px solid rgba(0,0,0,.15); }
  .grid { display:grid; grid-template-columns:repeat(6,1fr); gap:5px; }
  .cell { position:relative; width:40px; height:36px; border-radius:6px; border:1px solid rgba(0,0,0,.08); }
  .cell .stack { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    display:flex; flex-direction:column; align-items:center; gap:1px; z-index:1; padding:2px; border-radius:8px; }
  .cell:hover .stack { z-index:30; }
  /* compact by default: overlapping chips; on hover the whole stack fans open over a legible backdrop */
  .cell.multi .stack .mp-chip:not(:first-child) { margin-top:-7px; }
  .cell.multi .stack .mp-chip { box-shadow:0 1px 2px rgba(20,30,60,.28); }
  .cell.multi:hover .stack { gap:3px; background:rgba(255,255,255,.92); box-shadow:0 6px 18px rgba(20,30,60,.28); }
  .cell.multi:hover .stack .mp-chip:not(:first-child) { margin-top:0; }
  .mp-chip { font-size:.56rem; font-weight:700; line-height:1; padding:2px 5px; border-radius:9px; cursor:grab;
    user-select:none; white-space:nowrap; border:1.5px solid rgba(0,0,0,.18); touch-action:none; }
  .mp-chip.ghost { position:fixed; z-index:300; pointer-events:none; transform:translate(-50%,-50%) scale(1.12); }
  .carte-cap { font-size:.72rem; color:#868d9b; margin-top:.6rem; line-height:1.4; max-width:340px; }
  .row { display:flex; flex-wrap:wrap; gap:.35rem; margin-bottom:.5rem; }
  .chip { font:inherit; font-size:.76rem; border:1px solid var(--line); background:#fff; color:var(--sub); padding:.28rem .5rem; border-radius:7px; cursor:pointer; }
  .chip.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .ratioName { font-size:.72rem; color:var(--accent); min-height:1em; margin:-.2rem 0 .3rem; }
  /* échelle (ladder) instrument */
  #ladder .rung { display:flex; align-items:baseline; gap:.8rem; padding:.3rem .4rem; border-radius:7px; cursor:ns-resize; border:1px solid transparent; }
  #ladder .rung:hover { background:#fafbfc; border-color:var(--line); }
  #ladder .rung.drag { background:#fff; border-color:var(--accent); }
  #ladder .ltag { flex:none; width:60px; font-size:.68rem; color:var(--sub); text-transform:uppercase; letter-spacing:.03em; user-select:none; }
  #ladder .lspec { flex:1; color:var(--ink); overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  #ladder .lspec.multi { white-space:normal; }
  #ladder .lctl { flex:none; display:flex; gap:.22rem; }
  #ladder .lmini { font:inherit; font-size:.62rem; font-weight:600; width:19px; height:19px; padding:0; border:1px solid var(--line); background:#fff; color:var(--sub); border-radius:5px; cursor:pointer; }
  #ladder .lmini.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  #ladder .lmeta { flex:none; width:78px; text-align:right; font-size:.66rem; color:var(--sub); font-variant-numeric:tabular-nums; user-select:none; }
  #ladder .lmeta b { color:var(--ink); }
  /* -- Appareil facet -- */
  #instrument.apparatus { display:flex; flex-direction:column; align-items:center; gap:.8rem; padding:.5rem .3rem; width:100%; box-sizing:border-box; }
  .apspread { display:flex; gap:2px; width:100%; max-width:326px; justify-content:center; }
  .appage { flex:1 1 0; min-width:0; max-width:158px; background:#fff; border:1px solid var(--line); box-shadow:0 1px 4px rgba(20,30,60,.07); display:flex; flex-direction:column; }
  .appage:first-child { border-radius:8px 2px 2px 8px; }
  .appage:last-child { border-radius:2px 8px 8px 2px; }
  .aplbl { font-size:.6rem; letter-spacing:.06em; text-transform:uppercase; color:var(--sub); text-align:center; padding:.3rem 0 .1rem; }
  .apbody { flex:1; min-height:64px; }
  .apband { display:flex; gap:2px; padding:.2rem; }
  .apband.header { border-bottom:1px dashed var(--line); }
  .apband.footer { border-top:1px dashed var(--line); }
  .apslot { flex:1; min-width:0; min-height:40px; border:1px solid transparent; border-radius:5px; padding:.16rem .1rem; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.12rem; }
  .apslot.empty { background:repeating-linear-gradient(45deg,#fafbfd,#fafbfd 4px,#f0f2f6 4px,#f0f2f6 8px); }
  .apslot.drop { border-color:var(--accent); background:#e6ecff; box-shadow:inset 0 0 0 1px var(--accent); }
  .apslot .apz { font-size:.5rem; letter-spacing:.04em; text-transform:uppercase; color:var(--sub); }
  .aptoken { font:inherit; font-size:.68rem; color:var(--ink); background:#eef2ff; border:1px solid #c9d4f5; border-radius:6px; padding:.2rem .4rem; cursor:grab; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; touch-action:none; user-select:none; }
  .aptoken:hover { border-color:var(--accent); }
  .aptoken.src { background:#fff; border-color:var(--line); color:var(--sub); }
  .apghost { position:fixed; z-index:60; pointer-events:none; transform:translate(-50%,-140%); opacity:.92; box-shadow:0 4px 14px rgba(20,30,60,.28); }
  .apreserve { width:100%; max-width:340px; box-sizing:border-box; border:1px solid var(--line); border-radius:9px; background:#fbfcfe; padding:.4rem .5rem .5rem; }
  .aprlbl { font-size:.58rem; letter-spacing:.07em; text-transform:uppercase; color:var(--sub); margin-bottom:.35rem; }
  .aprtokens { display:flex; flex-wrap:wrap; gap:.3rem; }
  .apcap { font-size:.72rem; color:var(--sub); text-align:center; max-width:342px; line-height:1.4; }
</style>
</head>
<body>
<header style="display:flex;align-items:center;gap:.6rem;flex-wrap:wrap">
  <h1 style="margin:0">Éditeur de style</h1>
  <div id="styleMeta" style="display:flex;align-items:center;gap:.35rem;flex-wrap:wrap;margin-left:auto">
    <input id="mName"    placeholder="Nom du style" title="Nom du style" style="width:150px">
    <input id="mAuthor"  placeholder="Auteur"       title="Auteur"       style="width:120px">
    <input id="mVersion" placeholder="Version"      title="Version"      style="width:64px">
    <input id="mDate"    placeholder="AAAA-MM-JJ"   title="Date"         style="width:104px">
  </div>
  <div style="display:flex;align-items:center;gap:.35rem">
    <select id="gallery" class="chip" title="Partir d'un archétype fourni"><option value="">Nouveau depuis…</option></select>
    <button id="openSource"   class="chip" title="Rouvrir un style source (.mpstyle-src.json) pour l'éditer">Ouvrir…</button>
    <button id="exportSource" class="chip" title="Exporter le format source, ré-éditable">Source (.mpstyle-src)</button>
    <button id="exportStyle"  class="chip" title="Exporter le style compilé, à importer dans markpage">markpage (.mpstyle)</button>
    <input id="srcFile" type="file" accept=".json,.mpstyle-src.json" style="display:none">
  </div>
</header>

<div class="shell">
  <div id="editside">
    <div id="facetbar">
      <div class="tabs" id="tabs">
        <button data-facet="couleur" class="on">Couleur</button>
        <button data-facet="polices">Polices</button>
        <button data-facet="pages">Pages</button>
        <button data-facet="appareil">Appareil</button>
        <button data-facet="blocs">Blocs</button>
      </div>
    </div>
    <div id="editrow">
      <div id="panel"></div>
      <div id="workbench">
        <h3 id="instr-title">Carte — instrument</h3>
        <div id="instrument"></div>
      </div>
    </div>
  </div>
  <div id="pvr" role="separator" aria-orientation="vertical" title="Redimensionner l’aperçu"></div>
  <div id="preview">
    <div class="pbar">
      <span class="plabel">Aperçu — page à l’échelle</span>
      <div class="vtabs" id="vtabs">
        <button data-v="cover">Couverture</button>
        <button data-v="recto" class="on">Recto</button>
        <button data-v="chapter">Chapitre</button>
        <button data-v="spread">Recto-verso</button>
      </div>
    </div>
    <div class="parea" id="parea"></div>
  </div>
</div>
<div id="tip"></div>

<!-- optional: the archetype starter gallery, emitted by `npm run build:styles` -->
<script src="archetypes.gallery.js" onerror="void 0"></script>
<script>
// ===================== SHARED STYLE MODEL ==================================
// One model, three facets. Increment 1 wires COLOUR fully; typo & geometry feed
// the artefact from sensible defaults (their editing comes in inc. 2 & 3).

// ---- colour primitives (mirror style-vocabulary.ts) ----
const SAT=[0.06,0.18,0.32,0.48,0.65,0.82], VAL=[0.98,0.85,0.70,0.54,0.38,0.20], GRAY=[1,0.82,0.62,0.42,0.22,0];
const clampIdx=(n)=>Math.max(0,Math.min(5,Math.round(n)));
function hsvToHex(h,s,v){h=((h%360)+360)%360;const c=v*s,x=c*(1-Math.abs(((h/60)%2)-1)),m=v-c;let r=0,g=0,b=0;
  if(h<60)[r,g,b]=[c,x,0];else if(h<120)[r,g,b]=[x,c,0];else if(h<180)[r,g,b]=[0,c,x];
  else if(h<240)[r,g,b]=[0,x,c];else if(h<300)[r,g,b]=[x,0,c];else[r,g,b]=[c,0,x];
  const hx=(u)=>Math.round((u+m)*255).toString(16).padStart(2,'0');return`#${hx(r)}${hx(g)}${hx(b)}`;}
const isLight=(hex)=>{const n=parseInt(hex.slice(1),16);return 0.2126*((n>>16)&255)+0.7152*((n>>8)&255)+0.0722*(n&255)>140;};
const cranKey=(c)=>c.kind==='neutral'?`n${c.g}`:`${c.family}${c.s},${c.v}`;

// ---- unified roster: colour cran + typo step + role ----
const ROSTER=[
  {key:'page',  role:null, surface:true},
  {key:'cover', role:null, surface:true},
  {key:'running-content', role:'body', step:-1, ctrls:['rule','caps'], sample:'Note technique · titre courant · 3'},
  {key:'title', role:'head', step:5, ctrls:['align','rule','caps'], sample:'Titre du document'},
  {key:'subtitle', role:'head', step:3, ctrls:['align','rule','caps'], sample:'Un sous-titre en complément'},
  {key:'h1', role:'head', step:4, ctrls:['align','rule','caps'], sample:'Chapitre premier'},
  {key:'h2', role:'head', step:3, ctrls:['align','rule','caps'], sample:'Une section importante'},
  {key:'h3', role:'head', step:2, ctrls:['align','rule','caps'], sample:'Une sous-section'},
  {key:'h4', role:'head', step:1, ctrls:['align','rule','caps'], sample:'Un paragraphe titré'},
  {key:'chapter-number', role:'head', step:8, noColor:true, sample:'Chapitre 1'},   // size only (colour inherits h1)
  {key:'body', role:'body', step:0, multi:true, sample:'Le corps de texte porte la lecture continue ; sa taille est l’<b>ancre</b> de toute l’échelle. On appelle <code>deriveFontSizes(base, ratio)</code>, on note l’<i>italique</i>, et la moyenne <span class="mi">µ = ∑<sub>i</sub> x<sub>i</sub></span> se dérive — de quoi juger l’interligne, le gris et la justification.'},
  {key:'code', role:'code', scale:true}, {key:'math', role:'body', scale:true},
  {key:'caption', role:'body', step:-1, sample:'Figure 1 — légende de la figure'},
  {key:'note', role:'body', step:-1, sample:'1. Une note de bas de page, plus discrète.'},
  {key:'metadata', role:'body', step:0, ctrls:['align','rule','caps'], sample:'Prénom Nom · Mon organisation · 2026'},
];
// Ladder order = top-to-bottom reading order on the page (header → title block →
// chapter opening → headings → body → figure caption → footnote).
const LADDER=['running-content','title','subtitle','metadata','chapter-number','h1','h2','h3','h4','body','caption','note'];
const LABEL={page:'page',cover:'couv.','running-content':'en-tête',title:'titre',subtitle:'s-titre',h1:'H1',h2:'H2',h3:'H3',h4:'H4',
  'chapter-number':'n° chap',body:'corps',code:'code',math:'math',caption:'légende',note:'note',metadata:'méta'};

const S = {
  facet:'couleur',
  meta:{name:'Mon style', author:'', version:'1.0', date:''},
  // COLOUR
  hue1:213, angle:150,
  crans:{
    page:{kind:'neutral',g:0}, cover:{kind:'tint',family:'A',s:4,v:4}, 'running-content':{kind:'neutral',g:2},
    title:{kind:'tint',family:'A',s:4,v:4}, subtitle:{kind:'tint',family:'A',s:3,v:3},
    h1:{kind:'tint',family:'A',s:4,v:3}, h2:{kind:'tint',family:'B',s:3,v:2},
    h3:{kind:'tint',family:'A',s:3,v:2}, h4:{kind:'tint',family:'A',s:2,v:1},
    body:{kind:'neutral',g:5}, code:{kind:'neutral',g:4}, math:{kind:'neutral',g:5},
    caption:{kind:'neutral',g:3}, note:{kind:'neutral',g:3}, metadata:{kind:'neutral',g:3},
  },
  // TYPO
  fam:{head:'Source Serif 4', body:'Source Serif 4', code:'IBM Plex Mono'},
  base:11, ratio:1.25, lh:1.4, wHead:600, wBody:400, codeScale:0.9, mscale:1, mset:'stix2', pairing:'classique',
  steps:{}, align:{}, rule:{}, smallcaps:{}, tracking:0, justify:true,
  coverScale:1.4, coverAlign:'center',   // cover STYLE only (uniform zoom + alignment)
  // Headings numbered by the STYLE. General rule: numbers inherit their Hx style.
  // Local exception: the chapter-opening numeral has its own format (chapter facet lives in Polices).
  numbering:{on:true, depth:2, chapter:{format:'numeric'}},
  // PAGES
  pageFormat:'A4', landscape:false, duplex:false, hasCover:true, chapterBreak:'none', notesPos:'foot', geo:null,
  pgLayers:{diag:true,bands:true,notes:true,title:true},
  // APPAREIL — running-material composition, per band × parity × logical zone.
  // Position mirrors automatically (inner=spine, outer=edge); only content may differ verso/recto.
  running:{   // each zone is a STACK (list) of materials, rendered top→bottom
    header:{ verso:{inner:[],center:['doctitle'],outer:['folio']},
             recto:{inner:[],center:['chapter'], outer:['folio']} },
    footer:{ verso:{inner:[],center:[],outer:[]},
             recto:{inner:[],center:[],outer:[]} },
  },
  customText:'Notes de travail',
  // BLOCS — per block-element box styling (fond / bordure / padding / rayon)
  blocSel:'callout',
  blocks:{
    'code-block':{bgOn:true, bg:'#f4f6f9', bd:{on:false,color:'#d0d7de',width:1}, pad:0.55, radius:6},
    'quote':{bgOn:false, bg:'#f4f6f9', bd:{on:true,color:'#3f9d78',width:3}, pad:0.5, radius:3},
    'callout':{bgOn:true, bg:'#eef4ff', bd:{on:true,color:'#4a8cf0',width:1}, pad:0.7, radius:8},
  },
  // ARTEFACT view
  view:'recto',
};
const BLOC_KEYS=['callout','code-block','quote'], BLOC_LBL={callout:'callout','code-block':'code',quote:'citation'};
const blocCss=(b)=>`${b.bgOn?`background:${b.bg};`:''}padding:${b.pad}em;border-radius:${b.radius}px;${b.bd.on?`border:${b.bd.width}px solid ${b.bd.color};`:''}`;
ROSTER.forEach(r=>{ if(r.step!==undefined) S.steps[r.key]=r.step; });
LADDER.forEach(k=>{ const c=(ROSTER.find(e=>e.key===k)||{}).ctrls||[];

function renderArtefact(){
  const area=document.getElementById('parea'); if(!area) return;

  const gap=n>1?8:0;   // .parea flex gap between the two pages

  let pxmm=Math.min((availW-gap)/(n*pg.w), availH/pg.h); if(!(pxmm>0)) pxmm=1.6;

    for(let v=0;v<6;v++) for(let s=0;s<6;s++) grid.appendChild(mk({kind:'tint',family:fam,s,v}));
    blk.append(lab,grid); grids.appendChild(blk);

  for(const r of ROSTER){
    if(r.noColor) continue;                        // size-only element (e.g. chapter numeral), no colour chip
    const key=r.key;
    const cell=byKey.get(cranKey(S.crans[key])); if(!cell) continue;
    let stack=cell.querySelector('.stack');
    if(!stack){ stack=document.createElement('div'); stack.className='stack'; cell.appendChild(stack); }
    const chip=document.createElement('div'); chip.className='mp-chip'; chip.textContent=LABEL[key];
    const hex=colOf(key); chip.style.background=hex; chip.style.color=isLight(hex)?'#1a1f2b':'#fff';

function attachDrag(chip,key){
  chip.addEventListener('pointerdown',(e)=>{e.preventDefault();
    const ghost=chip.cloneNode(true); ghost.classList.add('ghost'); document.body.appendChild(ghost);
    const move=(ev)=>{ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px';}; move(e);
    const up=(ev)=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);ghost.remove();
      const cell=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.cell');
      if(cell&&cell._cran){S.crans[key]=cell._cran; renderInstrument(); renderArtefact();}};
    window.addEventListener('pointermove',move); window.addEventListener('pointerup',up);});
}

function attachRungDrag(row,key){

// -- Pages : the geometry instrument (full parity with the dedicated editor) --
const PX_TO_MM=25.4/96;
const pgTXT='#2b3a55', pgBND='#d08a3b', pgNOTE='#3f9d78', pgTTL='#c0507a', pgDIAG='#b3a0d6';
let PXMM=1, VERSO_X=0, RECTO_X=0, PAGE_W=0, PAGE_H=0, pgSvg=null;
const svgel=(t,a)=>{const e=document.createElementNS('http://www.w3.org/2000/svg',t);for(const k in a)e.setAttribute(k,a[k]);return e;};
const clamp=(v,lo,hi)=>Math.min(Math.max(v,lo),hi);
const mx=(x,mm)=>x+mm*PXMM, my=(yTop,mm)=>yTop+mm*PXMM;
const mmTxt=(v)=>`${Math.round(v)} mm`;
function showTip(x,y,t){const e=document.getElementById('tip');e.textContent=t;e.style.display='block';e.style.left=(x+14)+'px';e.style.top=(y+14)+'px';}
const hideTip=()=>{document.getElementById('tip').style.display='none';};
function charWidthMm(pt){const c=document.createElement('canvas').getContext('2d'); if(!c) return 0.5*pt*PT_TO_MM; c.font=`${pt*96/72}px ${S.fam.body}, Georgia, serif`; const s='abcdefghijklmnopqrstuvwxyz'; return (c.measureText(s).width/s.length)*PX_TO_MM;}
function repaintPages(){ renderPagesInstrument(); renderArtefact(); }
function pgLayout(){
  const pg=pageMm(), PAD=58;
  const availW=Math.max(380,(document.getElementById('workbench').clientWidth||620)-56), availH=470;
  PXMM=Math.min((availW-PAD*2)/(pg.w*2),(availH-PAD*2)/pg.h);
  PAGE_W=pg.w*PXMM; PAGE_H=pg.h*PXMM;
  const totalW=PAGE_W*2, svgW=availW, svgH=PAGE_H+PAD*2;
  VERSO_X=(svgW-totalW)/2; RECTO_X=VERSO_X+PAGE_W;
  pgSvg.setAttribute('width',svgW); pgSvg.setAttribute('height',svgH); pgSvg.setAttribute('viewBox',`0 0 ${svgW} ${svgH}`);
  pgSvg.dataset.yTop=PAD; return PAD;
}
function drawPaper(pageX,yTop,label){
  pgSvg.appendChild(svgel('rect',{x:pageX,y:yTop,width:PAGE_W,height:PAGE_H,fill:'#fff',stroke:'#c3c9d4','stroke-width':1}));
  const t=svgel('text',{x:pageX+PAGE_W/2,y:yTop+PAGE_H+22,'text-anchor':'middle','font-size':11,fill:'#5c6473','font-family':'system-ui'}); t.textContent=label; pgSvg.appendChild(t);
}
function drawDiagonals(yTop){
  const L=VERSO_X,R=VERSO_X+2*PAGE_W,M=VERSO_X+PAGE_W,T=yTop,B=yTop+PAGE_H;
  const d=(x1,y1,x2,y2)=>pgSvg.appendChild(svgel('line',{x1,y1,x2,y2,stroke:pgDIAG,'stroke-width':1,'stroke-dasharray':'5 4',opacity:.75}));
  d(L,T,R,B);d(R,T,L,B); d(L,T,M,B);d(M,T,L,B); d(M,T,R,B);d(R,T,M,B);
  pgSvg.appendChild(svgel('line',{x1:M,y1:T,x2:M,y2:B,stroke:'#c3c9d4','stroke-width':1}));
}
function hGuide(y_mm,color,op){ if(op===undefined)op=.85; const y=my(+pgSvg.dataset.yTop,y_mm); pgSvg.appendChild(svgel('line',{x1:VERSO_X,y1:y,x2:VERSO_X+2*PAGE_W,y2:y,stroke:color,'stroke-width':1,opacity:op})); }
function vGuide(pageX,x_mm,color){ const yTop=+pgSvg.dataset.yTop, x=mx(pageX,x_mm); pgSvg.appendChild(svgel('line',{x1:x,y1:yTop,x2:x,y2:yTop+PAGE_H,stroke:color,'stroke-width':1,opacity:.85})); }
function makeBlockDraggable(rect){
  rect.classList.add('block');
  rect.addEventListener('pointerdown',(e)=>{e.preventDefault(); try{rect.setPointerCapture(e.pointerId);}catch{}
    const r=pgSvg.getBoundingClientRect(), yTop=+pgSvg.dataset.yTop, pg=pageMm(), g0={...S.geo};
    const sx=(e.clientX-r.left-RECTO_X)/PXMM, sy=(e.clientY-r.top-yTop)/PXMM;
    const W=pg.w-g0.textInner-g0.textOuter, H=pg.h-g0.textTop-g0.textBottom;
    const move=(ev)=>{const dx=(ev.clientX-r.left-RECTO_X)/PXMM-sx, dy=(ev.clientY-r.top-yTop)/PXMM-sy;
      const inner=clamp(g0.textInner+dx,0,pg.w-W), top=clamp(g0.textTop+dy,0,pg.h-H);
      S.geo.textInner=inner; S.geo.textOuter=pg.w-inner-W; S.geo.textTop=top; S.geo.textBottom=pg.h-top-H;
      repaintPages(); showTip(ev.clientX,ev.clientY,`int ${mmTxt(inner)} · haut ${mmTxt(top)}`);};
    const up=()=>{hideTip();window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);};
    window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);});
}
function drawOverlay(pageX,yTop,g,verso){
  const pg=pageMm();
  const textL=verso?g.textOuter:g.textInner, textR=verso?g.textInner:g.textOuter;
  const runL=verso?g.runOuter:g.runInner, runR=verso?g.runInner:g.runOuter;
  const ty=my(yTop,g.textTop), th=(pg.h-g.textTop-g.textBottom)*PXMM;
  const rect=svgel('rect',{x:mx(pageX,textL),y:ty,width:(pg.w-textL-textR)*PXMM,height:th,fill:'rgba(43,58,85,.06)',stroke:'none'});
  pgSvg.appendChild(rect); if(!verso) makeBlockDraggable(rect);
  if(S.pgLayers.notes && g.noteWidth>0){
    const outerEdge=pg.w-textR, nA=verso?textL-g.noteGap-g.noteWidth:outerEdge+g.noteGap, nx=mx(pageX,nA), nw=g.noteWidth*PXMM;
    pgSvg.appendChild(svgel('rect',{x:nx,y:ty,width:nw,height:th,fill:'rgba(63,157,120,.15)',stroke:pgNOTE,'stroke-width':1.3}));
    const n=6, step=th/(n+1); for(let i=1;i<=n;i++) pgSvg.appendChild(svgel('line',{x1:nx+4,x2:nx+nw-4,y1:ty+i*step,y2:ty+i*step,stroke:pgNOTE,'stroke-width':.8,opacity:.3}));
  }
  vGuide(pageX,textL,pgTXT); vGuide(pageX,pg.w-textR,pgTXT);
  if(S.pgLayers.bands){ vGuide(pageX,runL,pgBND); vGuide(pageX,pg.w-runR,pgBND);
    const bx=mx(pageX,runL), bw=(pg.w-runL-runR)*PXMM;
    const band=(y_mm)=>pgSvg.appendChild(svgel('line',{x1:bx,x2:bx+bw,y1:my(yTop,y_mm),y2:my(yTop,y_mm),stroke:pgBND,'stroke-width':4,'stroke-linecap':'round'}));
    if(g.headerTop<g.textTop) band(g.headerTop); if(g.footerBottom<g.textBottom) band(pg.h-g.footerBottom);
  }
}
function grip(cx,cy,color,orient,set,tip){
  const gg=svgel('g',{class:'hit'});
  gg.appendChild(svgel('circle',{cx,cy,r:11,fill:'transparent'})); gg.appendChild(svgel('circle',{cx,cy,r:5,fill:color,stroke:'#fff','stroke-width':1.5}));
  gg.addEventListener('pointerdown',(e)=>{e.preventDefault(); try{gg.setPointerCapture(e.pointerId);}catch{}
    const r=pgSvg.getBoundingClientRect(), yTop=+pgSvg.dataset.yTop, pg=pageMm();
    const move=(ev)=>{const mm=orient==='h'?(ev.clientY-r.top-yTop)/PXMM:(ev.clientX-r.left-RECTO_X)/PXMM; set(clamp(mm,0,orient==='h'?pg.h:pg.w)); repaintPages(); showTip(ev.clientX,ev.clientY,tip());};
    const up=()=>{hideTip();window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);};
    window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);});
  pgSvg.appendChild(gg);
}
function connector(x1,y1,x2,y2,color){ pgSvg.appendChild(svgel('line',{x1,y1,x2,y2,stroke:color,'stroke-width':1,opacity:.45,'stroke-dasharray':'2 2'})); }
function gripH(get,set,color,dist,tip){ const yTop=+pgSvg.dataset.yTop, y=my(yTop,get()), x=VERSO_X-dist; connector(x,y,VERSO_X,y,color); grip(x,y,color,'h',set,tip); }
function gripV(get,set,color,dist,tip){ const yTop=+pgSvg.dataset.yTop, x=mx(RECTO_X,get()), y=yTop-dist; connector(x,y,x,yTop,color); grip(x,y,color,'v',set,tip); }
function cornerGrip(g,xEdge,yEdge){
  const yTop=+pgSvg.dataset.yTop, pg=pageMm(), MIN=10;
  const xmm=xEdge==='inner'?g.textInner:pg.w-g.textOuter, ymm=yEdge==='top'?g.textTop:pg.h-g.textBottom;
  const cx=mx(RECTO_X,xmm), cy=my(yTop,ymm);
  const h=svgel('rect',{x:cx-5.5,y:cy-5.5,width:11,height:11,rx:2,fill:pgTXT,stroke:'#fff','stroke-width':1.5,class:'hit'});
  h.style.cursor=(xEdge==='inner')===(yEdge==='top')?'nwse-resize':'nesw-resize';
  h.addEventListener('pointerdown',(e)=>{e.preventDefault(); try{h.setPointerCapture(e.pointerId);}catch{}
    const r=pgSvg.getBoundingClientRect();
    const move=(ev)=>{const px=clamp((ev.clientX-r.left-RECTO_X)/PXMM,0,pg.w), py=clamp((ev.clientY-r.top-yTop)/PXMM,0,pg.h);
      if(xEdge==='inner') g.textInner=clamp(px,0,pg.w-g.textOuter-MIN); else g.textOuter=clamp(pg.w-px,0,pg.w-g.textInner-MIN);
      if(yEdge==='top') g.textTop=clamp(py,0,pg.h-g.textBottom-MIN); else g.textBottom=clamp(pg.h-py,0,pg.h-g.textTop-MIN);
      repaintPages(); showTip(ev.clientX,ev.clientY,`${xEdge==='inner'?'int':'ext'} ${mmTxt(xEdge==='inner'?g.textInner:g.textOuter)} · ${yEdge==='top'?'haut':'bas'} ${mmTxt(yEdge==='top'?g.textTop:g.textBottom)}`);};
    const up=()=>{hideTip();window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);};
    window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);});

}
function renderPagesInstrument(){
  const host=document.getElementById('instrument'); host.className='';
  pgSvg=svgel('svg',{}); const yTop=pgLayout(), g=S.geo, pg=pageMm();
  drawPaper(VERSO_X,yTop,'verso'); drawPaper(RECTO_X,yTop,'recto');
  if(S.pgLayers.diag) drawDiagonals(yTop);
  drawOverlay(VERSO_X,yTop,g,true); drawOverlay(RECTO_X,yTop,g,false);
  hGuide(g.textTop,pgTXT); hGuide(pg.h-g.textBottom,pgTXT);
  if(S.pgLayers.bands){ hGuide(g.headerTop,pgBND,.35); hGuide(pg.h-g.footerBottom,pgBND,.35); }
  if(S.pgLayers.title){ hGuide(g.titleY,pgTTL); const yt=my(yTop,g.titleY); const tl=svgel('text',{x:VERSO_X+6,y:yt-4,'font-size':10,fill:pgTTL,'font-family':'system-ui'}); tl.textContent='titre'; pgSvg.appendChild(tl); }
  gripH(()=>g.textTop,v=>g.textTop=v,pgTXT,16,()=>`haut ${mmTxt(g.textTop)}`);
  gripH(()=>pg.h-g.textBottom,v=>g.textBottom=pg.h-v,pgTXT,16,()=>`bas ${mmTxt(g.textBottom)}`);
  gripV(()=>g.textInner,v=>g.textInner=v,pgTXT,16,()=>`intérieur ${mmTxt(g.textInner)}`);
  gripV(()=>pg.w-g.textOuter,v=>g.textOuter=pg.w-v,pgTXT,16,()=>`extérieur ${mmTxt(g.textOuter)}`);
  if(S.pgLayers.bands){
    gripH(()=>g.headerTop,v=>g.headerTop=v,pgBND,34,()=>`en-tête ${mmTxt(g.headerTop)}`);
    gripH(()=>pg.h-g.footerBottom,v=>g.footerBottom=pg.h-v,pgBND,34,()=>`pied ${mmTxt(g.footerBottom)}`);
    gripV(()=>g.runInner,v=>g.runInner=v,pgBND,34,()=>`aire int. ${mmTxt(g.runInner)}`);
    gripV(()=>pg.w-g.runOuter,v=>g.runOuter=pg.w-v,pgBND,34,()=>`aire ext. ${mmTxt(g.runOuter)}`);
  }
  if(S.pgLayers.notes){
    const oe=pg.w-g.textOuter;
    gripV(()=>oe+g.noteGap,v=>g.noteGap=clamp(v-oe,0,g.textOuter),pgNOTE,52,()=>`écart ${mmTxt(g.noteGap)}`);
    gripV(()=>oe+g.noteGap+g.noteWidth,v=>g.noteWidth=clamp(v-oe-g.noteGap,0,g.textOuter),pgNOTE,52,()=>`largeur ${mmTxt(g.noteWidth)}`);
  }
  if(S.pgLayers.title) gripH(()=>g.titleY,v=>g.titleY=clamp(v,g.textTop,pg.h-g.textBottom),pgTTL,16,()=>`titre +${mmTxt(g.titleY-g.textTop)}`);
  cornerGrip(g,'inner','top'); cornerGrip(g,'outer','top'); cornerGrip(g,'inner','bottom'); cornerGrip(g,'outer','bottom');
  host.replaceChildren(pgSvg);
  const cap=document.createElement('p'); cap.className='carte-cap';
  const cw=charWidthMm(S.base), textW=pg.w-g.textInner-g.textOuter;
  cap.innerHTML=`Bloc de texte <b>${textW.toFixed(0)} × ${(pg.h-g.textTop-g.textBottom).toFixed(0)} mm</b> · <b>${Math.round(textW/cw)} car/ligne</b> · glisse les traits (hors page), le bloc, les coins.`;
  host.appendChild(cap);
}

function attachApDrag(chip,payload){

      const t=document.elementFromPoint(ev.clientX,ev.clientY); setHot(t&&t.closest('.apslot'));}; move(e);
    const up=(ev)=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);ghost.remove();setHot(null);
      const tgt=document.elementFromPoint(ev.clientX,ev.clientY);
      const slot=tgt&&tgt.closest('.apslot');
      if(slot){
        const {band,parity,zone}=slot.dataset, target=S.running[band][parity][zone];
        // insertion index from the drop Y, relative to the tokens currently in the target
        const toks=[...slot.querySelectorAll('.aptoken')];
        let idx=toks.length;
        for(let i=0;i<toks.length;i++){const r=toks[i].getBoundingClientRect(); if(ev.clientY<(r.top+r.bottom)/2){idx=i;break;}}
        if(payload.src==='zone'){                                   // moving: lift from source, adjust idx if same stack shrank above
          const same=payload.band===band&&payload.parity===parity&&payload.zone===zone;
          S.running[payload.band][payload.parity][payload.zone].splice(payload.idx,1);
          if(same&&payload.idx<idx) idx--;
        }
        target.splice(idx,0,payload.m);                             // insert at the chosen position
        renderAppareilInstrument(); renderArtefact();
      } else if(payload.src==='zone'){                              // dropped outside any zone → remove
        S.running[payload.band][payload.parity][payload.zone].splice(payload.idx,1);
        renderAppareilInstrument(); renderArtefact();
      }};
    window.addEventListener('pointermove',move); window.addEventListener('pointerup',up);});
}

// ===================== COMPILER: editor S → markpage flat style ============
// The core of the "source → compiler → artefact" architecture: resolve every
// generative rule (crans→hex, base×ratio→pt, coverScale, numbering, apparatus)
// into a flat FUNDAMENTAL_STYLE that markpage loads verbatim (docs/STYLE-
// ALIGNMENT). Values only — markpage never re-interprets.
const MP_ELEM={ title:'title', subtitle:'subtitle', metadata:'metadata', h1:'h1', h2:'h2', h3:'h3', h4:'h4',
  body:'body', code:'code-block', math:'math-block', caption:'caption', note:'footnote',
  'running-content':'running-content' };
// Canonical order — MUST mirror markpage's ELEMENT_KEYS / FUNDAMENTAL_STYLE_KEYS
// so a compiled file equals markpage's own re-export byte-for-byte (a fixed point).
const MP_ELEMENT_ORDER=['body','title','subtitle','h1','h2','h3','h4','code-inline','inline-link','metadata',
  'code-block','quote','math-block','mermaid','callout','table','caption','footnote','running-content'];
const MP_KEY_ORDER=['pageSize','pageGeometry','duplex','chapterBreak','chapter','notes','numbering',
  'header','footer','runningApparatus','fonts','styles','mathScale','mathFontSet','pageBackground',
  'coverBackground','customFonts'];
function canonicalOrder(obj, order){ const o={};
  for(const k of order) if(obj[k]!==undefined) o[k]=obj[k];
  for(const k of Object.keys(obj)) if(!(k in o)) o[k]=obj[k];   // any extra, appended
  return o; }
function mpStyleForElement(key){
  const r=ROSTER.find(e=>e.key===key)||{};
  const st={ color:colOf(key), fontSize:ptOf(key) };
  if(r.role==='head') st.weight=S.wHead; else if(key==='body') st.weight=S.wBody;
  const c=r.ctrls||[];
  if(c.includes('align')&&S.align[key]) st.align=S.align[key];
  if(c.includes('rule')&&S.rule[key]&&S.rule[key]!=='none') st.rule={position:S.rule[key],color:colOf(key),width:1};
  if(c.includes('caps')&&S.smallcaps[key]&&S.smallcaps[key]!=='none'){ st.smallCaps=S.smallcaps[key]; if(S.tracking) st.letterSpacing=S.tracking; }
  return st;
}
function compileStyle(){
  const styles={};
  for(const r of ROSTER){
    if(r.surface||r.key==='chapter-number') continue;
    const mp=MP_ELEM[r.key]; if(mp) styles[mp]=mpStyleForElement(r.key);
  }
  if(styles['code-block']) styles['code-inline']={ color:styles['code-block'].color, fontSize:styles['code-block'].fontSize };
  // the 3 structural elements markpage renders but the instruments don't yet
  // expose — emitted as rule-derived entries (palette/scale-linked, not frozen
  // constants) so the matrix is COMPLETE → the round-trip is bijective.
  styles['inline-link']={ color:colOf('h1'), underline:true };   // link accent tracks the heading tint
  styles['mermaid']={ align:'center' };                          // structural default
  styles['table']={ fontSize:ptOf('body') };                     // tracks the base size
  // cover-only zoom: bake coverScale into title + metadata sizes + align
  for(const k of ['title','metadata']) if(styles[k]) styles[k]={...styles[k], fontSize:round2(styles[k].fontSize*S.coverScale), align:S.coverAlign};
  // block box styling (Blocs facet) → styles.<block>
  for(const k of BLOC_KEYS){ const b=S.blocks[k];
    styles[k]={ ...(styles[k]||{}), padding:b.pad, borderRadius:b.radius,
      ...(b.bgOn?{background:b.bg}:{}),
      ...(b.bd.on?{borderTop:true,borderRight:true,borderBottom:true,borderLeft:true,borderColor:b.bd.color,borderWidth:b.bd.width}:{}) }; }
  // running apparatus: S.running → RunningApparatus (materials; 'text' → {text})
  const zone=(a)=>a.map(m=>m==='text'?{text:S.customText}:m);
  const band=(b)=>({verso:{inner:zone(b.verso.inner),center:zone(b.verso.center),outer:zone(b.verso.outer)},
                    recto:{inner:zone(b.recto.inner),center:zone(b.recto.center),outer:zone(b.recto.outer)}});
  const PSIZE={A4:'A4',A5:'A5',B5:'B5',Letter:'LETTER','16:9':'SLIDES_16_9'};
  // RESOLVED page geometry (mm) — the terminal PageGeometry markpage renders from.
  // Emitted verbatim from the geometry instrument (S.geo) so markpage honours it as-is
  // (authoring dropped, no re-bake) → WYSIWYG + an immediate byte-identical fixed point.
  const PGm=pageMm(), G=S.geo;
  const pageGeometry={
    text:{ top:G.textTop, bottom:G.textBottom, inner:G.textInner, outer:G.textOuter,
           width:PGm.w-G.textInner-G.textOuter, height:PGm.h-G.textTop-G.textBottom },
    running:{ inner:G.runInner, outer:G.runOuter },
    header:{ top:G.headerTop }, footer:{ bottom:G.footerBottom },
    sidenote:{ gap:G.noteGap, width:G.noteWidth },
  };
  const out={
    fonts:{headings:S.fam.head, body:S.fam.body, code:S.fam.code},
    mathFontSet:S.mset, mathScale:S.mscale,
    pageSize:PSIZE[S.pageFormat]||'A4', pageGeometry, duplex:S.duplex,
    chapterBreak:S.chapterBreak, notes:{position:S.notesPos}, customFonts:[],
    // chapter opening "drop": the title line sinks (titleY − textTop) below the
    // text-block top (the classic book sink), from the geometry instrument.
    chapter:{ drop: Math.round(Math.max(0, S.geo.titleY - S.geo.textTop)*10)/10 },
    pageBackground:colOf('page'),
    ...(S.hasCover ? { coverBackground:colOf('cover') } : {}),
    styles:canonicalOrder(styles, MP_ELEMENT_ORDER),
    // chapterStyle 'marginal' → the chapter number hangs in the margin like the
    // section numbers (no big opening numeral), matching the marginal aesthetic.
    numbering:{on:S.numbering.on, depth:S.numbering.depth, chapterFormat:S.numbering.chapter.format, chapterNumeralPt:sizePt(S.steps['chapter-number']), chapterStyle:'marginal'},
    runningApparatus:{header:band(S.running.header), footer:band(S.running.footer)},
  };
  // canonical key order = markpage's serialize order → a byte-identical fixed point
  return canonicalOrder(out, MP_KEY_ORDER);
}
// ---- style identity + the two file formats -------------------------------
function slug(s){ return (s||'style').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'style'; }
function download(name, obj){
  const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  a.click(); URL.revokeObjectURL(a.href);
}
// compiled — flat, all-resolved; imported into markpage (lossy, not re-editable)
function exportStyle(){
  const m=S.meta, key=slug(m.name);
  download(`${key}.mpstyle.json`, {
    'markpage-style-file':1, key, name:m.name,
    author:m.author||undefined, version:m.version||undefined, date:m.date||undefined,
    style:compileStyle(),
  });
}
// source — the generative editor state; re-opened by the editor to keep editing
function exportSource(){
  download(`${slug(S.meta.name)}.mpstyle-src.json`, { 'markpage-style-src':1, meta:{...S.meta}, state:S });
}
function applySourceState(st){ Object.assign(S, st);   // S holds only data — safe to rehydrate
  syncMeta(); renderPanel(); renderInstrument(); renderArtefact(); }
function importSource(file){
  const r=new FileReader();
  r.onload=()=>{ try{
    const o=JSON.parse(r.result);
    const st=o&&o['markpage-style-src']?o.state:null;
    if(!st){ alert('Fichier source non reconnu (attendu : .mpstyle-src.json).'); return; }
    applySourceState(st);
  }catch(e){ alert('Lecture impossible : '+e.message); } };
  r.readAsText(file);
}
// Starter gallery — the built-in archetype SOURCES (generated by build:styles into
// archetypes.gallery.js). "Nouveau depuis…" rehydrates the editor from a source.
function initGallery(){
  const sel=document.getElementById('gallery'); if(!sel) return;
  const G=window.ARCHETYPE_GALLERY;
  if(!Array.isArray(G)||!G.length){ sel.style.display='none'; return; }
  sel.innerHTML='<option value="">Nouveau depuis…</option>'+
    G.map((g,i)=>`<option value="${i}">${g.name}</option>`).join('');
  sel.onchange=(e)=>{ const i=+e.target.value; if(e.target.value==='') return;
    applySourceState(JSON.parse(JSON.stringify(G[i].source.state))); e.target.value=''; };
}
// reflect S.meta into the header inputs (init + after import)
function syncMeta(){ for(const k of ['name','author','version','date'])
  document.getElementById('m'+k[0].toUpperCase()+k.slice(1)).value=S.meta[k]||''; }
for(const k of ['name','author','version','date']){
  document.getElementById('m'+k[0].toUpperCase()+k.slice(1)).oninput=(e)=>{ S.meta[k]=e.target.value; };
}
document.getElementById('exportStyle').onclick=exportStyle;
document.getElementById('exportSource').onclick=exportSource;
document.getElementById('openSource').onclick=()=>document.getElementById('srcFile').click();
document.getElementById('srcFile').onchange=(e)=>{ const f=e.target.files[0]; if(f) importSource(f); e.target.value=''; };

initGallery();
syncMeta();
renderPanel(); renderInstrument(); renderArtefact();
</script>
