name: Release @orlarey/markpage (npm)

# Builds the `markpage` command-line package (packages/markpage) and publishes
# it to npm. Its version (packages/markpage/package.json) is INDEPENDENT of the
# app's `v*` tags and of the extension's `vscode-v*` tags: it rides its own
# `npm-v*` tags.
#
#   1. bump `version` in packages/markpage/package.json
#   2. git commit, then: git tag npm-v0.2.0 && git push origin npm-v0.2.0
#
# Or run manually from the Actions tab (workflow_dispatch) once the version is
# bumped on the default branch.
#
# No npm token: npm's TRUSTED PUBLISHING (OIDC). GitHub proves to npm that the
# publish comes from this workflow of this repository; nothing secret is
# stored. Set up once on npmjs.com, in the package's Settings ▸ Trusted
# Publisher: GitHub Actions, user `orlarey`, repository `markpage`, workflow
# `npm-release.yml`, allowed action "npm publish". npm can only attach a
# trusted publisher to a package that EXISTS: the very first version is
# published by hand (see packages/markpage/README.md).
# Needs npm ≥ 11.5.1 and Node ≥ 22.14 (docs.npmjs.com/trusted-publishers).

on:
  push:
    tags: ['npm-v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build, test and pack, but do not publish'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # the OIDC token npm's trusted publishing asks for

jobs:
  publish:
    name: build · smoke · publish
    # Pinned for Playwright's browser install (see ci.yml).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs a recent npm, whatever Node ships.
      - run: npm install -g npm@^11.15.0 && node --version && npm --version
      - run: npm ci

      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PKG=$(node -p "require('./packages/markpage/package.json').version")
          TAG="${GITHUB_REF_NAME#npm-v}"
          [ "$PKG" = "$TAG" ] || { echo "tag $TAG != package.json $PKG"; exit 1; }

      # The viewer bundle the package ships (dist/viewer).
      - run: npm run build -w @orlarey/markpage

      # Pre-publish gate: render a small document through the command (html,
      # check, pdf, and the command reached through a symlink, as npx does).
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke -w @orlarey/markpage

      - name: Publish to npm (trusted publishing, no token)
        run: npm publish -w @orlarey/markpage --access public ${{ inputs.dry_run && '--dry-run' || '' }}
