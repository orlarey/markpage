name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: typecheck · unit tests · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Sanity-check the publishable tarballs (dist + types + styles).
      - run: npm pack --dry-run -w @orlarey/blocks -w @orlarey/marked

  e2e:
    name: end-to-end (Playwright)
    # Pinned: ubuntu-latest moved to 26.04, which Playwright 1.60 cannot
    # install its browser dependencies on ("does not support chromium on
    # ubuntu26.04-x64"). Unpin once Playwright supports it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # The markpage CLI (packages/markpage): build its viewer, render a small
      # document through headless Chromium, check the saved page.
      - run: npm run build -w @orlarey/markpage
      - run: npm run smoke -w @orlarey/markpage
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
