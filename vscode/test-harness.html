<!DOCTYPE html>
<!-- Dev harness: load the built webview bundle and feed it a sample document,
     to verify the markpage render pipeline (incl. phase-B MathJax/Mermaid) runs
     in a real browser. Not shipped. Open via a static server. The CSP mirrors
     the extension's htmlShell ('self' standing in for webview.cspSource), so a
     resource the webview would block fails here too (test/render-corpus.mjs). -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; script-src 'nonce-harness' 'strict-dynamic'; connect-src 'self' data:">
  <link rel="stylesheet" href="dist/webview.css">
  <link rel="stylesheet" href="media/preview.css">
</head>
<body class="mp-webview">
  <section id="preview-pane" class="markpage"></section>
  <!-- ESM module: attaches the message listener. -->
  <script type="module" nonce="harness" src="dist/webview.js"></script>
  <!-- Runs after the module above (modules execute in order), then posts. -->
  <script type="module" nonce="harness">
    const md = [
      '# markpage preview',
      '',
      '::: note',
      'A callout, with inline math $a^2 + b^2 = c^2$.',
      ':::',
      '',
      'Block math:',
      '',
      '$$\\int_0^1 x^2 \\, dx = \\frac{1}{3}$$',
      '',
      '```mermaid',
      'graph LR',
      '  A[Edit] --> B[Render]',
      '  B --> C[Preview]',
      '```',
      '',
      '```chart bar Sales',
      'Q1, 3',
      'Q2, 5',
      '```',
      '',
      '```category',
      'f : A -> B',
      'g : B -> C',
      '```',
      '',
      '```tree svg',
      'Root',
      '  Left',
      '  Right',
      '```',
      '',
      '```diff',
      '- old line',
      '+ new line',
      '```',
      '',
      '```python',
      'def square(x):',
      '    return x * x  # comment',
      '```',
      '',
      'Term',
      ': its definition',
      '',
      '> A blockquote.',
      '',
      'A claim with a footnote.[^a]',
      '',
      '[^a]: The footnote body, at the end.',
    ].join('\n');
    // Initial render; the floating widget (top-right) toggles pagination.
    window.dispatchEvent(new MessageEvent('message', { data: { type: 'render', md, baseUri: '', paginated: false } }));
  </script>
</body>
</html>
